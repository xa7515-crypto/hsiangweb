<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>《日月無憂》演奏歌單・手感版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Microsoft JhengHei','PingFang TC','Segoe UI',Arial,sans-serif;
  background:#211d17;
  color:#f3ead2;
  display:flex;flex-direction:column;
  position:relative;
}
/* 紙張顆粒感 */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
  mix-blend-mode:overlay;
  opacity:.35;
  pointer-events:none;
  z-index:50;
}

:root{
  --ink:#241f18;
  --panel:#2c2620;
  --panel2:#242019;
  --paper:#f3ead2;
  --paper-line:#e2d2a8;
  --accent:#e07b39;
  --accent2:#b8551f;
  --red:#b73f30;
  --red-dark:#7a2920;
  --muted:#8f8266;
  --ink-soft:#cbb98c;
}

/* Header — 錄音帶標籤感 */
.hdr{
  background:var(--panel);
  padding:10px 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:2px dashed rgba(224,123,57,.35);
  flex-shrink:0;
  position:relative;
}
.rec-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 3px rgba(183,63,48,.22);
  flex-shrink:0;
  animation:recBlink 1.7s ease-in-out infinite;
}
@keyframes recBlink{0%,100%{opacity:1}50%{opacity:.25}}
.hdr h1{
  font-size:16px;font-weight:900;color:var(--paper);
  letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-bottom:2px solid var(--accent2);
  padding-bottom:1px;
}
.badges{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.bdg{
  border-radius:2px;padding:2px 11px;font-size:11px;font-weight:800;
  white-space:nowrap;
  border:1px dashed rgba(36,31,24,.5);
  box-shadow:2px 2px 0 rgba(0,0,0,.35);
}
.bdg-t{background:var(--accent);color:var(--ink);transform:rotate(-2deg)}
.bdg-r{background:var(--red);color:var(--paper);transform:rotate(2deg)}

/* Toolbar — 打字機感 */
.tb{
  padding:9px 12px;background:var(--panel2);
  border-bottom:2px dashed rgba(224,123,57,.2);
  display:flex;gap:7px;align-items:center;flex-shrink:0;
}
#si{
  flex:1;min-width:0;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:2px;
  padding:8px 12px;color:var(--ink);font-size:14px;font-family:inherit;
  outline:none;-webkit-appearance:none;
  box-shadow:3px 3px 0 rgba(0,0,0,.35);
  transition:box-shadow .15s,border-color .15s;
}
#si:focus{border-color:var(--accent2);box-shadow:3px 3px 0 var(--accent)}
#si::placeholder{color:var(--muted)}
.fb{
  border-radius:3px;padding:8px 14px;cursor:pointer;font-size:12px;font-family:inherit;
  font-weight:800;border:2px solid var(--ink);white-space:nowrap;flex-shrink:0;
  background:var(--paper);color:var(--ink);
  box-shadow:2px 2px 0 rgba(0,0,0,.4);
  transform:rotate(-1deg);
  transition:transform .12s,box-shadow .12s;
}
.fb-r{transform:rotate(1deg)}
.fb-a.on{background:var(--accent);border-color:var(--accent2);transform:rotate(1deg)}
.fb-r.on{background:var(--red);color:var(--paper);border-color:var(--red-dark);transform:rotate(-1deg)}
#cb{
  background:var(--panel);border:2px dashed var(--muted);color:var(--ink-soft);
  border-radius:3px;padding:8px 10px;cursor:pointer;font-size:13px;font-family:inherit;flex-shrink:0;
}

/* Main layout */
.main{display:flex;flex:1;overflow:hidden;min-height:0}

/* Song panel */
.ps{
  flex-shrink:0;overflow-y:auto;padding:12px;
  background:var(--panel2);
  border-right:2px dashed rgba(224,123,57,.18);
  width:370px;
}
.ps::-webkit-scrollbar{width:4px}
.ps::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}

/* Song buttons — 便利貼手感 */
.sb{
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:2px;padding:7px 8px;cursor:pointer;text-align:left;
  color:var(--ink);font-family:inherit;font-size:12px;
  display:flex;align-items:flex-start;gap:4px;line-height:1.4;
  position:relative;
  box-shadow:2px 2px 0 rgba(0,0,0,.32);
  transition:transform .12s,box-shadow .12s;
  -webkit-user-select:none;user-select:none;width:100%;
}
.sg .sb:nth-child(odd){transform:rotate(-.7deg)}
.sg .sb:nth-child(even){transform:rotate(.7deg)}
.sb:active{transform:scale(.94) rotate(0deg) !important}
.sb.red{border-color:var(--red-dark)}
.sb.red .t{
  background-image:linear-gradient(180deg,transparent 58%,rgba(183,63,48,.32) 58%);
}
.sb.act{
  background:var(--accent);border-color:var(--accent2);color:var(--ink);
  box-shadow:3px 3px 0 var(--accent2);
  transform:rotate(0deg) scale(1.04);
  z-index:2;
}
.sb.red.act{
  background:var(--red);color:var(--paper);border-color:var(--red-dark);
  box-shadow:3px 3px 0 var(--red-dark);
}
.sb .n{font-size:9px;font-weight:800;flex-shrink:0;margin-top:2px;min-width:18px;opacity:.65}
.sb:not(.red) .n{color:var(--accent2)}
.sb.red .n{color:var(--red-dark)}
.sb.act .n, .sb.red.act .n{color:inherit;opacity:.85}
.sb .t{flex:1;word-break:break-all}
.rd{
  width:8px;height:8px;border-radius:50%;background:var(--red);
  position:absolute;top:-4px;right:-3px;
  box-shadow:0 0 0 2px var(--paper),1px 1px 0 rgba(0,0,0,.3);
}
.nr{text-align:center;padding:30px;color:var(--muted);font-size:13px;display:none}

/* Lyrics panel — 稿紙感 */
.pl{
  flex:1;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;min-width:0;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(var(--paper) 0px,var(--paper) 32px,var(--paper-line) 33px);
  color:#3a3020;
}
.pl::-webkit-scrollbar{width:4px}
.pl::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:3px}
.es{margin:auto;text-align:center}
.es .ei{font-size:48px;opacity:.25;display:block;margin-bottom:8px;filter:grayscale(1)}
.es p{font-size:13px;color:var(--muted)}

.lh{margin-bottom:18px;padding-bottom:14px;border-bottom:2px dashed rgba(90,65,35,.3)}
.lmeta{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.lno{font-size:11px;color:var(--accent2);font-weight:800;letter-spacing:.8px}
.lrb{
  background:var(--red);color:var(--paper);
  border-radius:2px;padding:2px 10px;font-size:10px;font-weight:800;
  display:inline-block;transform:rotate(-2deg);
  box-shadow:1px 1px 0 rgba(0,0,0,.3);
}
.ltitle{font-size:28px;font-weight:900;color:#2a2117;margin-bottom:8px;line-height:1.25}
.ltitle.rt{color:var(--red-dark)}
.lkey{
  display:inline-block;background:var(--accent);color:#2a2117;
  border-radius:2px;padding:3px 10px;font-size:12px;font-weight:700;
  transform:rotate(-1deg);box-shadow:1px 1px 0 rgba(0,0,0,.3);
}
.lbody{font-size:15px;line-height:2.15;color:#3d3322;white-space:pre-wrap;word-break:break-word;flex:1;font-family:'PMingLiU','Songti TC',serif}

/* Legend */
.leg{
  display:flex;align-items:center;gap:12px;padding:6px 14px;
  background:var(--panel);border-top:2px dashed rgba(224,123,57,.18);
  font-size:11px;color:var(--ink-soft);flex-shrink:0;
}
.li{display:flex;align-items:center;gap:4px}
.lb2{width:10px;height:10px;border-radius:2px;border:1px solid;flex-shrink:0}
.lbn{background:var(--paper);border-color:var(--muted)}
.lbr{background:var(--red);border-color:var(--red-dark)}
.sc{font-size:11px;color:var(--accent);margin-left:auto;white-space:nowrap}

/* ── MOBILE: top horizontal strip ── */
@media(max-width:700px){
  .main{flex-direction:column}

  .ps{
    width:100%;
    border-right:none;
    border-bottom:2px dashed rgba(224,123,57,.2);
    padding:8px;
    overflow-x:auto;
    overflow-y:hidden;
    flex-shrink:0;
  }
  .ps::-webkit-scrollbar{height:4px}
  .ps::-webkit-scrollbar-thumb{background:var(--accent)}

  .sg{
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    gap:6px;
    width:max-content;
  }
  .sb{
    width:88px;
    flex-shrink:0;
    transform:none !important;
  }

  .pl{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:16px 14px;
  }
  .ltitle{font-size:22px}
  .lbody{font-size:14.5px;line-height:2.0}
  .hdr h1{font-size:14px}
  .fb{padding:7px 11px;font-size:11px}
}
@media(max-width:380px){
  .sb{width:80px;font-size:11px}
  .ltitle{font-size:19px}
}
</style>
</head>

let an=null,ank=null,cf='all',cq='';

function eh(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function rg(){
  const q=cq.trim().toLowerCase();
  const g=document.getElementById('sg');
  g.innerHTML='';
  let c=0;
  S.forEach(s=>{
    const ms=!q||s.name.toLowerCase().includes(q)||(s.num&&String(s.num).includes(q));
    const mf=cf==='all'||(cf==='red'&&s.red);
    if(!ms||!mf)return;
    c++;
    const b=document.createElement('button');
    const ia=s.num!==null?s.num===an:s.name===ank;
    b.className='sb'+(s.red?' red':'')+(ia?' act':'');
    b.dataset.num=s.num;
    b.dataset.nk=s.name;
    b.innerHTML='<span class="n">'+(s.num||'—')+'</span><span class="t">'+eh(s.name)+'</span>'+(s.red?'<span class="rd"></span>':'');
    b.addEventListener('click',()=>sl(s));
    g.appendChild(b);
  });
  document.getElementById('nr').style.display=c?'none':'block';
  document.getElementById('sc').textContent=(q||cf==='red')?('共 '+c+' 首'):'';
}

function sl(s){
  an=s.num; ank=s.name;
  document.querySelectorAll('.sb').forEach(b=>{
    b.classList.toggle('act',s.num!==null?parseInt(b.dataset.num)===s.num:b.dataset.nk===s.name);
  });
  const np=s.num?('NO. '+String(s.num).padStart(3,'0')):'';
  const rb=s.red?'<span class="lrb">🔴 紅色標記</span>':'';
  const ks=s.key?'<div class="lkey">&#127925; 調性 '+eh(s.key)+'</div>':'';
  const lt=s.lyric||'（暫無歌詞）';
  document.getElementById('pl').innerHTML=
    '<div class="lh">'+
      '<div class="lmeta"><span class="lno">'+np+'</span>'+rb+'</div>'+
      '<div class="ltitle'+(s.red?' rt':'')+'">'+eh(s.name)+'</div>'+ks+
    '</div>'+
    '<div class="lbody">'+eh(lt)+'</div>';
  document.getElementById('pl').scrollTop=0;
}

function sf(f){
  cf=f;
  document.getElementById('ba').classList.toggle('on',f==='all');
  document.getElementById('br').classList.toggle('on',f==='red');
