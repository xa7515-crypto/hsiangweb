            <p style="text-indent:36;">台灣四面環海，多山多溪谷，親水的機會非常多，相對地溺水事件也不少，為了培養小朋友具備「游泳」的自救能力，及早學會游泳技能，以備不時之需，也為了強化小朋友水上活動安全與救生知識，建立終生游泳或運動的習慣，配合游泳教學希望所有小朋友具備游泳能力，及一般水中自救技能。</p>
            <p style="text-indent:36;">期望小朋友，都能具備游泳的能力，建立終生游泳或運動的習慣，達到「健身強國」的教育目標。</p>
